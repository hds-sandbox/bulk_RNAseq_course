on:
  push:
    branches:
      - webpage
      - main
  workflow_dispatch:

name: Quarto Publish

env:
  # Render inside the UCloud Transcriptomics app container,
  # so the website uses the app's R and package versions
  APP_IMAGE: hdssandbox/transcriptomicsapp:latest

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space for the app image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get data
        run: |
          wget -O Data.zip  https://zenodo.org/records/12090853/files/Data.zip?download=1
          unzip Data.zip
          rm Data.zip
          mkdir -p Results

      - name: Pull Notebooks folder content
        run: |
          git clone https://github.com/hds-sandbox/bulk_RNAseq_course.git temp_repo
          cp -r temp_repo/Notebooks/*.Rmd develop
          cp -r temp_repo/Notebooks/img/* develop/img/
          rm -rf temp_repo

      - name: Render site in the app container
        run: |
          docker pull "$APP_IMAGE"
          docker run --rm --user root \
            -v "$PWD":"$PWD" -w "$PWD" \
            -e RENV_CONFIG_AUTOLOADER_ENABLED=FALSE \
            "$APP_IMAGE" \
            bash -c 'mkdir -p /work/Intro_to_bulkRNAseq && quarto render'
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
